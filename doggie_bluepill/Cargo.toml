[package]
edition = "2021"
name = "doggie_bluepill"
version = "0.1.0"

[features]
usb = ["dep:embassy-usb"]
uart = []
mcp = ["dep:mcp2515"]
int = []
default = ["uart", "int"]

[dependencies]
embassy-stm32 = { version = "0.2.0", features = [ "defmt", "stm32f103c8", "unstable-pac", "memory-x", "time-driver-any" ]  }
embassy-sync = { version = "0.7.0", features = ["defmt"] }
embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.4.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-usb = { version = "0.3.0", features = ["defmt"], optional = true }
embassy-futures = { version = "0.1.0" }

defmt = "0.3"
defmt-rtt = "0.4"

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "0.3", features = ["print-defmt"] }
heapless = { version = "0.8", default-features = false }
nb = "1.0.0"
static_cell = "2.0.0"

slcan = { version = "0.1.0", path = "../slcan"}
doggie_core = { version = "0.1.0", path = "../doggie_core"}
evil_core = { version = "0.1.0", path = "../evil_core"}

mcp2515 = {version = "0.3.0", optional = true }
embedded-io = "0.6.1"
embedded-io-async = "0.6.1"
embedded-hal = "1.0.0"
embedded-can = "0.4.1"

[profile.dev]
opt-level = 3
lto = true
debug = 2

[profile.release]
codegen-units = 1
opt-level = 3
strip = true
lto = true
debug = 0
