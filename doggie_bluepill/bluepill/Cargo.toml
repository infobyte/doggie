[package]
edition = "2021"
name = "bluepill"
version = "0.1.0"

[dependencies]
embassy-stm32 = { version = "0.2.0", features = [ "defmt", "stm32f103c8", "unstable-pac", "memory-x", "time-driver-any" ]  }
embassy-usb = { version = "0.3.0", features = ["defmt"]}
embassy-futures = { version = "0.1.0" }

defmt = "0.3"

embedded-io = "0.6.1"
embedded-io-async = "0.6.1"

[profile.dev]
opt-level = 3
lto = true
debug = 2

[profile.release]
codegen-units = 1
opt-level = 3
# strip = true
lto = true
# debug = 0
