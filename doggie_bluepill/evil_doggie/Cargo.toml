[package]
edition = "2021"
name = "evil_doggie"
version = "0.1.0"

[features]
usb = ["dep:embassy-usb", "dep:static_cell"]
uart = []
default = ["usb"]

[dependencies]
embassy-stm32 = { version = "0.2.0", features = [ "defmt", "stm32f103c8", "unstable-pac", "memory-x", "time-driver-any" ]  }
embassy-sync = { version = "0.7.0", features = ["defmt"] }
embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.4.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-usb = { version = "0.3.0", features = ["defmt"], optional = true }
embassy-futures = { version = "0.1.0" }

defmt = "0.3"
defmt-rtt = "0.4"

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "0.3", features = ["print-defmt"] }
static_cell = { version = "2.0.0", optional = true }

evil_core = { version = "0.1.0", path = "../../evil_core"}
bluepill = { version = "0.1.0", path = "../bluepill"}

embedded-io = "0.6.1"
embedded-io-async = "0.6.1"

[profile.dev]
opt-level = 3
lto = true
debug = 2

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
