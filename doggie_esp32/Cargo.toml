[package]
name = "doggie_esp32"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-hal = { version = "0.23.1", features = ["unstable"] }
esp-backtrace = { version = "0.15.0", features = [
    "exception-handler",
    "panic-handler",
    "defmt",
] }
esp-hal-embassy = { version = "0.6.0", features = ["defmt"] }
esp-wifi = { version = "0.12.0", features = ["ble"], optional = true }
esp-alloc = { version = "0.6.0" }

embassy-time = { version = "0.4.0" }
embassy-executor = { version = "0.7.0", features = ["task-arena-size-32768"] }
embassy-sync = { version = "0.6.0" }
embassy-futures = "0.1.0"

embedded-io-async = "0.6.1"
embedded-hal = "1.0.0"
embedded-can = "0.4.1"

log = { version = "0.4.22" }
static_cell = "2.1.0"
mcp2515 = { version = "0.3.0", optional = true }
doggie_core = { version = "0.1.0", path = "../doggie_core"}
evil_core = { version = "0.1.0", path = "../evil_core"}
defmt = { version = "0.3.8", features = ["encoding-raw"] }
embedded-hal = "1.0.0"
embedded-can = "0.4.1"
nb = "1.1.0"
cfg-if = "1.0.0"
bt-hci = { version = "0.2", optional = true }    

doggie_core = { version = "0.1.0", path = "../doggie_core" }
doggie_ble = { version = "0.1.0", path = "../doggie_ble", optional = true }

xtensa-lx = "0.9.0"
riscv = "0.10.1"


[features]
ble = ["dep:doggie_ble", "dep:esp-wifi", "dep:bt-hci"]
mcp = ["dep:mcp2515"]
twai = []
esp32   = ["esp-hal/esp32",   "esp-backtrace/esp32",   "esp-hal-embassy/esp32",   "esp-wifi/esp32"]
esp32c2 = ["esp-hal/esp32c2", "esp-backtrace/esp32c2", "esp-hal-embassy/esp32c2", "esp-wifi/esp32c2"]
esp32c3 = ["esp-hal/esp32c3", "esp-backtrace/esp32c3", "esp-hal-embassy/esp32c3", "esp-wifi/esp32c3"]
esp32c6 = ["esp-hal/esp32c6", "esp-backtrace/esp32c6", "esp-hal-embassy/esp32c6", "esp-wifi/esp32c6"]
esp32h2 = ["esp-hal/esp32h2", "esp-backtrace/esp32h2", "esp-hal-embassy/esp32h2", "esp-wifi/esp32h2"]
esp32s2 = ["esp-hal/esp32s2", "esp-backtrace/esp32s2", "esp-hal-embassy/esp32s2", "esp-wifi/esp32s2"]
esp32s3 = ["esp-hal/esp32s3", "esp-backtrace/esp32s3", "esp-hal-embassy/esp32s3", "esp-wifi/esp32s3"]
default = ["ble", "twai"]

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"
debug = 2

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = true
opt-level = 3
