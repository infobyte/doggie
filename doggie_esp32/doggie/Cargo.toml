[package]
name = "doggie"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-bootloader-esp-idf = "0.4.0"
esp-alloc = { version = "0.9.0" }
esp-hal = { version = "1.0.0", features = ["unstable"] }
esp-backtrace = { version = "0.18.1", features = [
    "panic-handler",
    "defmt",
] }
esp-rtos = { version = "0.2", features = ["defmt", "embassy", "esp-radio"] }

embassy-time = { version = "0.5.0" }
embassy-executor = { version = "0.9.1" }
embassy-sync = { version = "0.7.2" }
embassy-futures = "0.1.2"

embedded-io-async = "0.6.1"
embedded-hal = "1.0.0"
embedded-can = "0.4.1"

# BLE
esp-radio = { version = "0.17.0", features = ["ble", "unstable"], optional = true }
static_cell = { version = "2.1.1", optional = true }
bt-hci = { version = "0.6", optional = true }
doggie_ble = { version = "0.1.0", path = "../../doggie_ble", optional = true }

log = { version = "0.4.28" }
mcp2515 = { version = "0.3.0", optional = true }
defmt = { version = "1.0.1", features = ["encoding-rzcobs"] }
nb = "1.1.0"
cfg-if = "1.0.4"

doggie_core = { version = "0.1.0", path = "../../doggie_core" }
esp_serial = { version = "0.1.0", path = "../esp_serial" }


[features]
ble = ["dep:doggie_ble", "dep:esp-radio", "dep:bt-hci", "dep:static_cell"]
mcp = ["dep:mcp2515"]
twai = []
esp32   = ["esp-hal/esp32",   "esp-backtrace/esp32",   "esp-rtos/esp32",   "esp-radio/esp32",   "esp-bootloader-esp-idf/esp32", "esp_serial/esp32"]
esp32c3 = ["esp-hal/esp32c3", "esp-backtrace/esp32c3", "esp-rtos/esp32c3", "esp-radio/esp32c3", "esp-bootloader-esp-idf/esp32c3", "esp_serial/esp32c3"]
esp32c2 = ["esp-hal/esp32c2", "esp-backtrace/esp32c2", "esp-rtos/esp32c2", "esp-radio/esp32c2", "esp-bootloader-esp-idf/esp32c2", "esp_serial/esp32c2"]
esp32c6 = ["esp-hal/esp32c6", "esp-backtrace/esp32c6", "esp-rtos/esp32c6", "esp-radio/esp32c6", "esp-bootloader-esp-idf/esp32c6", "esp_serial/esp32c6"]
esp32h2 = ["esp-hal/esp32h2", "esp-backtrace/esp32h2", "esp-rtos/esp32h2", "esp-radio/esp32h2", "esp-bootloader-esp-idf/esp32h2", "esp_serial/esp32h2"]
esp32s2 = ["esp-hal/esp32s2", "esp-backtrace/esp32s2", "esp-rtos/esp32s2", "esp-radio/esp32s2", "esp-bootloader-esp-idf/esp32s2", "esp_serial/esp32s2"]
esp32s3 = ["esp-hal/esp32s3", "esp-backtrace/esp32s3", "esp-rtos/esp32s3", "esp-radio/esp32s3", "esp-bootloader-esp-idf/esp32s3", "esp_serial/esp32s3"]
default = ["ble", "twai"]

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"
debug = 2

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = true
opt-level = 3
